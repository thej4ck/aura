name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# un nuovo push sullo stesso ramo rende inutile il run precedente
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controlli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test

  e2e:
    name: e2e ${{ matrix.nome }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # gruppi bilanciati sulla durata (le shard di Playwright dividono per numero di test, e il progetto dev
    # pesa più di tutti gli altri insieme). Un progetto nuovo in playwright.config.ts va aggiunto qui
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: pagine e voce
            argomenti: --project chromium --project voce
          - nome: microfono
            argomenti: --project mic
          - nome: dev 1/3
            argomenti: --project dev --shard=1/3
          - nome: dev 2/3
            argomenti: --project dev --shard=2/3
          - nome: dev 3/3
            argomenti: --project dev --shard=3/3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: cache-pw
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      # niente --with-deps: il runner ha già Chrome con le sue librerie, e apt-get a volte resta appeso per minuti
      - if: steps.cache-pw.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npm run test:e2e -- ${{ matrix.argomenti }}

  # il controllo obbligatorio su main si chiama «ci»: passa solo se passano tutti gli altri
  ci:
    if: always()
    needs: [controlli, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.controlli.result }}" = success && test "${{ needs.e2e.result }}" = success
